<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CardioVigía v2.4.0 - Panel de Monitoreo Quirúrgico</title>
    <link rel="stylesheet" href="/css/styles.css">
    <script src="/js/script.js" defer></script>
</head>
<body>
    <div class="container">
        <form>

        <h1>CardioVigía v2.4.0</h1>

        <h2 class="subtitle">Instituto Cardiovascular del Plata (ICP) — Monitoreo de Cirugías Cardíacas</h2>

            <h3>1. Validación de Telemetría (RF-01 / RF-02)</h3>
            <label for="fc">Frecuencia Cardíaca (lpm):</label>
            <input type="number" id="fc" min="0" max="300" step="0.01" required>

            <label for="pam">Presión Arterial Media (mmHg):</label>
            <input type="number" id="pam" value="85" min="20" max="200" step="0.01" required>

            <button type="button" id="btnValidar" onclick="validar()">Validar Signos Vitales</button>
            <div id="resultadoValidacion" class="badge" aria-live="polite">Pendiente de validación</div>

            <h3>2. Clasificación de Riesgo IA (RF-06 / RF-07)</h3>
            <label for="probabilidad">Probabilidad de Complicación Hemodinámica (%):</label>
            <input type="number" id="probabilidad" value="85" min="0" max="100" step="0.01" required>

            <button type="button" id="btnEvaluarRiesgo" onclick="evaluar()">Evaluar Riesgo en Vivo</button>
            <div id="resultadoRiesgo" class="badge" aria-live="polite">Pendiente de evaluación</div>

        </form>
    </div>
</body>
</html>
